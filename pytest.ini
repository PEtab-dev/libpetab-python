[pytest]
addopts = --doctest-modules --durations=0 --durations-min=10
testpaths =
    petab
    tests
filterwarnings =
    error
    # SWIG-generated bindings (python-libcombine) on Python>=3.14.
    #  Raising this warning during module initialization segfaults.
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
